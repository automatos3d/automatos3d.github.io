baseURL = 'https://automatos3d.github.io/'
languageCode = 'en-us'
title = 'AUTOMATOS 3D'
publishDir = 'docs'

[params]
  brandName = 'AUTOMATOS 3D'
  motto = "AI-Generated. Human-Refined.\nUnity-Tested."
  description = "We forge 3D assets with AI, refine them by hand and test every model inside the Unity engine.\n\nSo what you ship looks great and works flawlessly."
  contactEmail = 'automatos3d@gmail.com'
  contactLabel = 'Get in touch'
  contactLinks = [ { label = 'Bluesky', url = 'https://bsky.app/profile/automatos3d.bsky.social' } ]
  # Default product video (embed ID) — override per product with `youtube:` in its front matter
  defaultRigged = 'Yes, Humanoid'
  defaultTriangles = '~20K'
  logo = 'images/brand/icon_big.png'
  heroImage = 'images/brand/banner_big.jpg'

# No taxonomies are used — keep the output minimal
disableKinds = ['taxonomy', 'term']

[markup.goldmark.renderer]
  unsafe = true
