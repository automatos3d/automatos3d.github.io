<a class="card" href="{{ .RelPermalink }}">
  <div class="card__media">
    <img src="{{ .Params.image | relURL }}" alt="{{ .Title }}" loading="lazy">
    {{ with .Params.type }}<span class="card__tag">{{ . }}</span>{{ end }}
  </div>
  <div class="card__body">
    <h3 class="card__title">{{ .Title }}</h3>
    <p class="card__meta">{{ .Params.price }} · {{ .Params.formats }}</p>
    <p class="card__summary">{{ .Params.summary }}</p>
  </div>
</a>
